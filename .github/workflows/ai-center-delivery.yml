name: AI-Center encrypted internal APK delivery
on:
  push:
    branches: [ai-center-build]
    paths: ['delivery/**', '.github/workflows/ai-center-delivery.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-center-private-delivery
  cancel-in-progress: false
jobs:
  delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 594ebd5bd2fd95af02b8b55a622df53d1a991de1
          path: source
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
        with:
          dependency-graph: disabled
      - name: Transport authentication tests
        run: python3 transport/delivery/test_encrypted_delivery.py
      - name: Prepare pinned Android and native model
        working-directory: source/AI-Center
        run: |
          python3 scripts/android_ci.py prepare
          python3 scripts/prepare_native.py
      - name: Build and verify signed ARM64 application
        working-directory: source/AI-Center
        env:
          GITHUB_SHA: 594ebd5bd2fd95af02b8b55a622df53d1a991de1
        run: |
          python3 scripts/test_core.py
          python3 scripts/verify_project.py
          python3 scripts/build_android.py
          python3 scripts/package_internal_apk.py
      - name: Encrypt verified application
        run: |
          python3 transport/delivery/encrypted_delivery.py encrypt --input source/AI-Center/build/internal-delivery/AI-Center-594ebd5bd2fd-internal.apk --metadata source/AI-Center/build/internal-delivery/manifest.json --key transport/delivery/public.pem --output encrypted
          test ! -f encrypted/part-53.bin
      - name: Save authenticated manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AI-Center-encrypted-manifest
          path: encrypted/manifest.json
          retention-days: 2
          if-no-files-found: error
      - name: Save encrypted part 00
        if: ${{ hashFiles('encrypted/part-00.bin') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AI-Center-encrypted-part-00
          path: encrypted/part-00.bin
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
      - name: Save encrypted part 01
        if: ${{ hashFiles('encrypted/part-01.bin') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AI-Center-encrypted-part-01
          path: encrypted/part-01.bin
