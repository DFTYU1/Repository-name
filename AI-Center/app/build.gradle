plugins { id 'com.android.application' }
android {
    namespace 'local.aicenter.app'
    compileSdk 36
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'local.aicenter.app'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '0.1.0-dev'
        testInstrumentationRunner 'local.aicenter.app.FoundationInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        debug { applicationIdSuffix '.dev' }
        release { minifyEnabled false }
    }
}
dependencies { implementation project(':platform-android') }
